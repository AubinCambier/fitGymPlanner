services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitgym
      POSTGRES_PASSWORD: fitgym
      POSTGRES_DB: fitgym
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitgym -d fitgym"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://fitgym:fitgym@db:5432/fitgym
      JWT_SECRET: ${JWT_SECRET:-changeme_en_prod}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
